# monero_dart test configuration.
#
# Backends (see test/test_backend.dart and test/suite_setup.dart):
#   BU_BACKEND=dart                                  # pure Dart, no build (default)
#   BU_BACKEND=ffi [BU_LIB_PATH=...] [BU_FFI_PROFILE=release]
#   BU_BACKEND=ffi BU_BUILD=ffi                      # cargo-build the .so if missing
#   dart tool/build_backends.dart --ffi [--profile release] [--features <list>]  # prebuild FFI
#   dart tool/build_backends.dart --wasm [--force]    # build test/wasm_assets
#
# Runners (one_shot entry):
#   dart test test/one_shot_test.dart                              # VM, pure Dart (default)
#   BU_BACKEND=ffi dart test test/one_shot_test.dart               # VM, FFI
#   CHROME_EXECUTABLE=<wrapper> dart test -p chrome test/one_shot_browser_dart_test.dart  # browser, pure Dart
#   CHROME_EXECUTABLE=<wrapper> dart test -p chrome test/one_shot_browser_wasm_test.dart  # browser, full WASM suite
#   CHROME_EXECUTABLE=<wrapper> dart test -p chrome test/browser_wasm_test.dart            # browser, WASM smoke
